ekf_filter_node:
  ros__parameters:
    frequency: 40.0
    sensor_timeout: 0.1
    two_d_mode: false
    publish_tf: true

    # Odometry
    odom0: /lauv/odometry
    odom0_config: [true, true, true,  # x y z
                  true, true, true,  # roll pitch yaw
                  false, false, false,  # x_vel y_vel z_vel
                  false, false, false,  # roll_rate pitch_rate yaw_rate
                  false, false, false] # x_accel y_accel z_accel
    odom0_remove_covariance: true

    # IMU
    imu0: /lauv/imu
    imu0_config: [false, false, false, 
                  false, false, false, 
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]
    imu0_remove_covariance: true

    # DVL
    twist0: /model/lauv/dvl/velocity
    twist0_config: [false, false, false,  
                    false, false, false, 
                    true, true, true, 
                    false, false, false,
                    false, false, false]
    twist0_queue_size: 5
    twist0_differential: false
    twist0_relative: false
