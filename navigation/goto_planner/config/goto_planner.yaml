goto_planner:
  ros__parameters:
    namespace: bluerov2
    # odom_topic: /model/bluerov2/eskf/odom
    odom_topic: /model/bluerov2/odometry

    goal_x: 4.0
    goal_y: 0.0
    goal_z: -9.0
    # goal_yaw: 0.0              # rad ENU (0=East, 1.5708=North). Omit to skip ORIENT stage.

    # Tolerances
    xy_tolerance:  0.7           # m — APPROACH bubble radius
    z_tolerance:   0.5           # m
    yaw_tolerance: 0.1           # rad — ORIENT done threshold

    # Velocity thresholds for "stopped" decision before SETTLE begins
    v_lin_stop: 0.09             # m/s
    v_ang_stop: 0.09             # rad/s

    # Time to damp velocity in SETTLE before starting ORIENT (s)
    settle_time: 2.0

    # LOS surge profile
    # Surge = max_surge_cmd * tanh(dist / slow_radius) * cos(yaw_err)
    slow_radius: 1.5             # m

    # Proportional gains
    k_yaw:   3.0                 # N per rad
    k_heave: 6.0                 # N per m

    # Derivative (damping) gains
    k_d_surge: 5.0               # N per (m/s)
    k_d_yaw:   1.5               # N per (rad/s)
    k_d_heave: 3.0               # N per (m/s)

    # Saturation
    max_thrust:    4.0           # N per thruster
    max_surge_cmd: 3.0           # N — cruise thrust
    max_yaw_cmd:   4.0           # N
    max_heave_cmd: 4.0           # N

    control_rate_hz: 20.0

    # Set true if the robot turns the wrong way when approaching a y≠0 goal.
    # Watch ~/debug/yaw_err: it should shrink toward 0 while APPROACH is active.
    # If it grows instead, flip this flag.
    invert_yaw: true
