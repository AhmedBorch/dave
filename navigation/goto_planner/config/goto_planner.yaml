goto_planner:
  ros__parameters:
    namespace: bluerov2
    # odom_topic: /model/bluerov2/eskf/odom
    odom_topic: /model/bluerov2/odometry

    goal_x: 0.0
    goal_y: 2.0
    goal_z: -1.0

    # Tolerances
    xy_tolerance: 0.7          # m — declare goal reached inside this radius
    z_tolerance:  0.5          # m

    # LOS surge profile
    # Surge thrust = max_surge_cmd * tanh(dist / slow_radius) * cos(yaw_err)
    # slow_radius: distance at which surge begins to ramp down noticeably.
    # Smaller = tighter braking zone, but may cause oscillation if too small.
    slow_radius: 1.5           # m

    # Proportional gains
    k_yaw:   3.0               # N per rad of heading error
    k_heave: 6.0               # N per m of depth error

    # Derivative (velocity damping) gains
    k_d_surge: 5.0             # N per (m/s) forward speed  — increase to damp overshoot
    k_d_yaw:   1.5             # N per (rad/s) yaw rate
    k_d_heave: 3.0             # N per (m/s) heave speed

    # Saturation
    max_thrust:    4.0        # N per thruster
    max_surge_cmd:  3.0        # N — cruise thrust magnitude (scale down if too aggressive)
    max_yaw_cmd:    4.0        # N
    max_heave_cmd:  4.0        # N

    control_rate_hz: 20.0


    #velocity limits
    v_lin_stop: 0.09
    v_ang_stop: 0.09
