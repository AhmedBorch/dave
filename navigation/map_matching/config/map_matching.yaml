map_matching:
  ros__parameters:
    # Full reference map of the structure (PCD), expressed in the structure's local frame.
    # Two options are available in the maps/ directory:
    #   instruments_rig.pcd  — full structure reference
    #   lidar_frame.pcd      — single lidar frame capture
    full_map_path: ""   # ← set this to the absolute install path or pass via launch arg

    # I/O topics
    input_cloud_topic: /model/bluerov2/lidar/points
    output_pose_topic: ~/vehicle_pose

    # World/output frame for the published pose.
    world_frame: map

    # Pose of the structure origin in the world frame (ENU, metres + xyzw quaternion).
    # Set this to wherever the structure is spawned in Gazebo.
    structure_position: [16.0, 10.0, -12.0]
    structure_orientation_xyzw: [0.0, 0.0, 0.8415, 0.5403]  # yaw = 2.0 rad exactly (world file)

    # Lidar mount in base_link frame — from model.sdf:
    #   <pose relative_to="base_link">0.25 0 0.05 0 0 0</pose>
    # Used to convert T_world_lidar → T_world_baselink.
    lidar_position: [0.25, 0.0, 0.05]
    lidar_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]

    # RANSAC coarse alignment
    ransac:
      voxel_size: 0.3
      max_iterations: 100000

    # GICP refinement
    gicp:
      max_correspondence_distance: 0.5
      max_iterations: 50
      voxel_size: 0.05

    # ── Covariance method ────────────────────────────────────────────────────
    # false → simple diagonal covariance scaled by GICP fitness/RMSE (fast)
    # true  → Brossard analytic Censi/Bonnabel covariance via icp_with_cov
    #         (requires the 3d-icp-cov library to be compiled)
    use_brossard_cov: true

    # Brossard parameters (only used when use_brossard_cov: true)
    brossard:
      # Sensor range noise std dev [m] — matches lidar noise.stddev in model.sdf
      std_sensor: 0.01
      # false = Censi (sensor noise only)
      # true  = Bonnabel (sensor noise + calibration bias terms)
      use_bonnabel: false
      # Voxel size for downsampling before the Brossard ICP call [m].
      # Should match gicp.voxel_size for consistent point density.
      voxel_size: 0.05

    # Simple uncertainty estimator (used when use_brossard_cov: false)
    uncertainty:
      base_translation_var: 0.01
      base_rotation_var: 0.001

    # Fault check: reject results whose recovered roll or pitch exceeds this.
    # RANSAC is rerun (stochastic) up to max_ransac_retries times before giving up.
    roll_pitch_limit_deg: 10.0
    max_ransac_retries: 3

    # Voting / mode filter (replaces running average).
    # Keep the last vote_buffer_size valid estimates; publish the centroid of the
    # densest cluster (poses within vote_cluster_radius metres of each other).
    # Outlier RANSAC results that land far from the true position will form small
    # minority clusters and be ignored.
    vote_buffer_size: 30
    vote_cluster_radius: 0.3

    # Quality gates
    # Minimum number of LiDAR points required to attempt registration.
    min_points: 600
    # Number of valid estimates to collect silently before publishing anything.
    # Allows the vote buffer to warm up and prevents noisy early outputs.
    warmup_measurements: 20
    # Consecutive-scan consistency thresholds. If a new estimate jumps further
    # than these limits from the previous one, it is flagged as inconsistent:
    #   - the raw topic is published with covariance scaled by consistency_covariance_scale
    #   - the voted topic reuses the last stable voted estimate (buffer not updated)
    consistency_max_translation_m: 1.0
    consistency_max_rotation_deg: 10.0
    consistency_covariance_scale: 1000.0
