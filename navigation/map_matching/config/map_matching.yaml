map_matching:
  ros__parameters:
    # Full reference map of the structure (PCD), expressed in the structure's frame.
    full_map_path: ""

    # I/O topics
    input_cloud_topic: /model/bluerov2/lidar/points
    output_pose_topic: ~/vehicle_pose

    # World/output frame for the published pose.
    world_frame: map

    # Pose of the structure in the world frame.
    structure_position: [0.0, 0.0, 0.0]
    structure_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]

    # RANSAC coarse alignment
    ransac:
      voxel_size: 0.3
      max_iterations: 100000

    # GICP refinement (placeholder backend: Open3D Generalized ICP)
    gicp:
      max_correspondence_distance: 0.5
      max_iterations: 50
      voxel_size: 0.05

    # Uncertainty estimator (placeholder)
    uncertainty:
      base_translation_var: 0.01
      base_rotation_var: 0.001
